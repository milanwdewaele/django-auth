{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aanmelden</title>
    <link rel="stylesheet" type="text/css" href="{% static 'css/style.css' %}">
</head>
<body>
    {% include "form_app/_navbar.html" %}
    <div class="container">
        <img src="{% static 'images/logo.png' %}" alt="Logo" class="logo">
        <h1>Aanmelden</h1>
        {% if form.errors %}
            <p>De gebruikersnaam of het wachtwoord is incorrect.</p>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Aanmelden</button>
        </form>
    </div>
</body>
</html>
